# Yajang Defense PoC — GameCI WebGL build
# Runs on push to main and on manual dispatch. No local Unity install needed.
# Unity version is pinned to 6000.3.28f1, matching ProjectSettings/ProjectVersion.txt
# and the verified GameCI Docker tag ubuntu-6000.3.28f1-webgl-4.0.0 (see VERSION-NOTES.md).
# Required GitHub Secrets (set in the repo settings, never in this file):
#   UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
name: Build WebGL (PoC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build project (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 6000.3.28f1
          buildPath: build

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-PoC
          path: build
          if-no-files-found: error
